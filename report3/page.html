<title>Carried Normal Equations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
:root {
  --bg: #f6f7f5;
  --surface: #fcfcfb;
  --ink: #15191b;
  --ink-2: #4b5357;
  --ink-3: #737b7f;
  --rule: #dadedb;
  --grid: #e8ebe8;
  --accent: #0f5c63;
  --band: rgba(21, 25, 27, 0.06);
  --good: #0b7a3e;
  --warn: #9a6400;
  --bad: #b3261e;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s4: #eda100;
  --s5: #e87ba4;
  --s6: #008300;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #141716;
    --surface: #1a1d1c;
    --ink: #eef1ef;
    --ink-2: #b9c0bd;
    --ink-3: #8b9390;
    --rule: #333836;
    --grid: #262a29;
    --accent: #6cc3cb;
    --band: rgba(238, 241, 239, 0.07);
    --good: #4cc27f;
    --warn: #e0a73a;
    --bad: #f0857d;
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
    --s5: #d55181;
    --s6: #2f9a2f;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141716;
  --surface: #1a1d1c;
  --ink: #eef1ef;
  --ink-2: #b9c0bd;
  --ink-3: #8b9390;
  --rule: #333836;
  --grid: #262a29;
  --accent: #6cc3cb;
  --band: rgba(238, 241, 239, 0.07);
  --good: #4cc27f;
  --warn: #e0a73a;
  --bad: #f0857d;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --s4: #c98500;
  --s5: #d55181;
  --s6: #2f9a2f;
}
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.6 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
.page { max-width: 1040px; margin: 0 auto; padding: 48px 20px 80px; display: grid; gap: 40px; }
.prose { max-width: 68ch; }
h1, h2, h3 { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 2.3rem; letter-spacing: -0.01em; }
h2 { font-size: 1.55rem; }
h3 { font-size: 1.15rem; }
p { margin: 0; }
.stack { display: grid; gap: 14px; }
.eyebrow { font: 500 0.75rem/1.2 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.lede { font-size: 1.12rem; color: var(--ink-2); }
.meta { font-size: 0.85rem; color: var(--ink-3); }
code, .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.88em; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.verdict { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 22px 24px; display: grid; gap: 12px; }
.verdict ul { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; }
section { display: grid; gap: 18px; }
section + section { border-top: 1px solid var(--rule); padding-top: 36px; }
.problem-grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 24px; align-items: start; }
@media (max-width: 820px) { .problem-grid { grid-template-columns: minmax(0, 1fr); } }
.chart-card { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 14px 14px 8px; position: relative; }
.chart-title { font-size: 0.85rem; color: var(--ink-2); margin-bottom: 6px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { font-family: "IBM Plex Sans", system-ui, sans-serif; fill: var(--ink-3); font-size: 11px; }
svg .label { font-size: 11.5px; font-weight: 500; fill: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.82rem; color: var(--ink-2); padding: 4px 2px 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 16px; height: 2px; border-radius: 1px; display: inline-block; }
.tooltip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; padding: 8px 10px; font-size: 0.8rem; box-shadow: 0 4px 14px rgba(0,0,0,0.12); min-width: 150px; z-index: 2; }
.tooltip .t-head { color: var(--ink-3); margin-bottom: 4px; font-family: "IBM Plex Mono", monospace; font-size: 0.75rem; }
.tooltip .t-row { display: flex; align-items: center; gap: 8px; }
.tooltip .t-row b { font-variant-numeric: tabular-nums; color: var(--ink); min-width: 56px; text-align: right; }
.tooltip .t-row i { width: 12px; height: 2px; display: inline-block; }
.tooltip .t-row span { color: var(--ink-2); }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 500; color: var(--ink-3); font-size: 0.76rem; letter-spacing: 0.03em; }
td.method { display: flex; align-items: center; gap: 8px; }
td.method i { width: 14px; height: 2px; display: inline-block; }
.pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 0.76rem; font-weight: 500; border: 1px solid currentColor; }
.pill.good { color: var(--good); }
.pill.warn { color: var(--warn); }
.pill.bad { color: var(--bad); }
.note { font-size: 0.86rem; color: var(--ink-2); }
.two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px 32px; }
.callout { border-left: 3px solid var(--accent); padding: 4px 0 4px 16px; }
ol.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 10px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style>
details { border: 1px solid var(--rule); border-radius: 6px; padding: 10px 14px; background: var(--surface); }
details summary { cursor: pointer; font-weight: 500; color: var(--ink-2); }
details[open] summary { margin-bottom: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 20px; }
.pending { border: 1px dashed var(--rule); border-radius: 6px; padding: 14px 16px; color: var(--ink-2); font-size: 0.9rem; }
.legend i.dot { width: 9px; height: 9px; border-radius: 50%; }
.fail-mark { stroke: var(--bad); stroke-width: 2; }
td.num { font-variant-numeric: tabular-nums; }
.tag { font: 500 0.7rem/1 "IBM Plex Mono", monospace; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 6px; border-radius: 3px; border: 1px solid var(--rule); color: var(--ink-3); }
</style><style>
#lit-table td, #lit-table th { white-space: normal; text-align: left; vertical-align: top; min-width: 9rem; }
#lit-table td:first-child { font-weight: 500; }
</style>
<style>
.status { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 0.88rem; color: var(--ink-2); }
.bar { flex: 1 1 220px; height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; max-width: 360px; }
.bar > span { display: block; height: 100%; background: var(--accent); }
tr.baseline td { font-weight: 600; }
td.pending { color: var(--ink-3); font-style: italic; }
.setting { display: inline-flex; align-items: center; gap: 8px; }
.setting i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
</style>
<main class="page">
  <header class="stack prose">
    <div class="eyebrow">DT-FBSDE · degree-4 polynomial · recursive least squares</div>
    <h1>Does carrying the normal equations help?</h1>
    <p class="lede"><!--LEDE--></p>
    <div class="status" id="status"></div>
  </header>

  <div class="verdict" id="findings">
    <div class="eyebrow">What the runs show</div>
    <!--FINDINGS-->
  </div>

  <section class="stack">
    <div class="prose stack">
      <h2>The settings</h2>
      <!--SETTINGS-->
    </div>
  </section>

  <div id="problems"></div>

  <section class="stack">
    <div class="prose stack">
      <h2>How to read the numbers</h2>
      <!--NOTES-->
    </div>
  </section>
</main>

<script>
const DATA = /*DATA*/null;
const NS = "http://www.w3.org/2000/svg";
const NO_RESET = "var(--s1)", RESET = "var(--s2)", BASE = "var(--ink-2)";
function el(tag, attrs = {}, parent) { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); if (parent) parent.appendChild(n); return n; }
function h(tag, attrs = {}, text) { const n = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); if (text !== undefined) n.textContent = text; return n; }
const pct = g => g === null || g === undefined ? "breakdown" : ((g >= 0 ? "+" : "") + (Math.abs(100 * g) >= 100 ? (100 * g).toFixed(0) : (100 * g).toFixed(1)) + "%");
const secs = t => t === null || t === undefined ? "never" : (t < 1 ? (t * 1000).toFixed(0) + " ms" : t < 10 ? t.toFixed(1) + " s" : t.toFixed(0) + " s");
const label = e => e.memory === 0 ? "No memory (current method)" : `ρ = ${e.memory}${e.reset ? ", reset on acceptance" : ""}`;
const color = e => e.memory === 0 ? BASE : (e.reset ? RESET : NO_RESET);

function status() {
  const s = document.getElementById("status");
  const frac = DATA.done / DATA.total;
  const bar = h("div", { class: "bar", role: "progressbar", "aria-valuenow": String(DATA.done), "aria-valuemax": String(DATA.total) });
  const fill = h("span"); fill.style.width = (100 * frac).toFixed(1) + "%"; bar.appendChild(fill);
  s.append(h("span", {}, `${DATA.done} of ${DATA.total} runs finished`), bar, h("span", {}, `Updated ${DATA.updated}`));
}

function strip(container, problem) {
  const card = h("div", { class: "chart-card" });
  card.appendChild(h("div", { class: "chart-title" }, "Final gap to the grid optimum after 30 s, one dot per seed (log; dashed: 5%)"));
  const entries = problem.entries;
  const rowH = 24, m = { l: 238, r: 20, t: 6, b: 34 }, W = 640, H = m.t + m.b + rowH * entries.length;
  const floor = 0.001, top = 10;
  const x = v => m.l + (Math.log10(Math.max(v, floor)) - Math.log10(floor)) / (Math.log10(top) - Math.log10(floor)) * (W - m.l - m.r);
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `Final gaps per setting, ${problem.name}` }, card);
  for (const t of [0.001, 0.01, 0.1, 1, 10]) {
    el("line", { x1: x(t), x2: x(t), y1: m.t, y2: H - m.b, stroke: "var(--grid)" }, svg);
    const lab = el("text", { x: x(t), y: H - m.b + 14, "text-anchor": "middle" }, svg);
    lab.textContent = t === 0.001 ? "≤0.1%" : (100 * t >= 1 ? (100 * t).toFixed(0) : (100 * t).toFixed(1)) + "%";
  }
  el("line", { x1: x(0.05), x2: x(0.05), y1: m.t, y2: H - m.b, stroke: "var(--ink-3)", "stroke-dasharray": "3 4" }, svg);
  const xl = el("text", { x: (m.l + W - m.r) / 2, y: H - 4, "text-anchor": "middle" }, svg); xl.textContent = "final gap (log)";
  entries.forEach((e, i) => {
    const cy = m.t + rowH * i + rowH / 2;
    if (i === 5) el("line", { x1: 0, x2: W, y1: cy - rowH / 2, y2: cy - rowH / 2, stroke: "var(--rule)" }, svg);
    const t = el("text", { x: m.l - 10, y: cy + 4, "text-anchor": "end", class: "label" }, svg); t.textContent = label(e);
    if (!e.result) {
      const p = el("text", { x: m.l + 6, y: cy + 4 }, svg); p.textContent = "pending"; return;
    }
    e.result.gaps.forEach((g, j) => {
      const dy = ((j % 3) - 1) * 3;
      if (g === null) {
        const cx = W - m.r - 4;
        el("line", { x1: cx - 3.5, x2: cx + 3.5, y1: cy + dy - 3.5, y2: cy + dy + 3.5, class: "fail-mark" }, svg);
        el("line", { x1: cx - 3.5, x2: cx + 3.5, y1: cy + dy + 3.5, y2: cy + dy - 3.5, class: "fail-mark" }, svg);
        return;
      }
      const c = el("circle", { cx: x(g), cy: cy + dy, r: 4.5, fill: color(e), stroke: "var(--surface)", "stroke-width": 1.5 }, svg);
      const tt = el("title", {}, c); tt.textContent = `${label(e)}, seed ${j}: ${pct(g)}`;
    });
  });
  container.appendChild(card);
}

function table(container, problem) {
  const wrap = h("div", { class: "table-wrap" });
  const t = h("table");
  const head = h("tr");
  ["Setting", "Seeds done", "Final gap, median", "Worst seed", "Within 5% at end", "Median time to 5%", "Updates accepted", "Iterations"].forEach(c => head.appendChild(h("th", {}, c)));
  t.appendChild(head);
  for (const e of problem.entries) {
    const tr = h("tr", e.memory === 0 ? { class: "baseline" } : {});
    const td = h("td"); const span = h("span", { class: "setting" }); const dot = h("i"); dot.style.background = color(e);
    span.append(dot, document.createTextNode(label(e))); td.appendChild(span); tr.appendChild(td);
    const r = e.result;
    if (!r) {
      tr.appendChild(h("td", { class: "pending" }, `0 of ${DATA.seeds}`));
      for (let k = 0; k < 6; k++) tr.appendChild(h("td", { class: "pending" }, "–"));
    } else {
      [`${r.runs} of ${DATA.seeds}`, pct(r.gap_median), pct(r.gap_worst), `${r.within5_at_end} of ${r.runs}`, secs(r.seconds_to_5),
       (100 * r.accepted).toFixed(1) + "%", String(Math.round(r.iterations))].forEach(v => tr.appendChild(h("td", {}, v)));
    }
    t.appendChild(tr);
  }
  wrap.appendChild(t);
  container.appendChild(wrap);
}

status();
const root = document.getElementById("problems");
for (const problem of DATA.problems) {
  const sec = h("section", { class: "stack" });
  const prose = h("div", { class: "prose stack" });
  prose.appendChild(h("h2", {}, problem.name.replace("L1 ", "").replace(/^./, c => c.toUpperCase())));
  sec.appendChild(prose);
  const legend = h("div", { class: "legend" });
  for (const [name, c] of [["No memory (current method)", BASE], ["Memory, no reset", NO_RESET], ["Memory, reset on acceptance", RESET]]) {
    const s = h("span"); const i = h("i", { class: "dot" }); i.style.background = c; s.append(i, document.createTextNode(name)); legend.appendChild(s);
  }
  sec.appendChild(legend);
  strip(sec, problem);
  table(sec, problem);
  root.appendChild(sec);
}
</script>
