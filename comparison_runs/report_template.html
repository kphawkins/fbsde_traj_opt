<script>
const DATA = /*DATA*/null;
const NOTES = /*NOTES*/{};
const SERIES = [
  { key: "DT-FBSDE", color: "var(--s1)" },
  { key: "FBRRT", color: "var(--s2)" },
  { key: "iLQR", color: "var(--s3)" },
  { key: "MPPI+LQR", color: "var(--s4)" },
];
const TABLE_METHODS = ["DT-FBSDE", "FBRRT", "iLQR", "iLQR (zero init)", "MPPI+LQR", "MPPI"];
const COLOR = Object.fromEntries(SERIES.map(s => [s.key, s.color]));
COLOR["iLQR (zero init)"] = "var(--s3)";
COLOR["MPPI"] = "var(--s5)";
const NS = "http://www.w3.org/2000/svg";

function el(tag, attrs = {}, parent) {
  const node = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
}
function h(tag, attrs = {}, text) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text !== undefined) node.textContent = text;
  return node;
}
function fmtGap(g) {
  if (g === null || g === undefined || !isFinite(g)) return "–";
  const p = 100 * g;
  if (Math.abs(p) >= 100) return (p >= 0 ? "+" : "") + p.toFixed(0) + "%";
  return (p >= 0 ? "+" : "") + p.toFixed(1) + "%";
}
function fmtTime(t) {
  if (t === null || t === undefined || !isFinite(t)) return "never";
  if (t < 0.01) return (t * 1000).toFixed(1) + " ms";
  if (t < 1) return (t * 1000).toFixed(0) + " ms";
  if (t < 10) return t.toFixed(1) + " s";
  return t.toFixed(0) + " s";
}
const GAP_FLOOR = 0.002;  // gaps below 0.2% draw at the floor of the log axis

function gapChart(container, entry) {
  const W = 600, H = 330, m = { l: 52, r: 86, t: 12, b: 40 };
  const times = entry.times;
  const tMin = times[0], tMax = entry.budget;
  const methods = SERIES.filter(s => entry.methods[s.key]);
  let gMax = 0.05;
  for (const s of methods) for (const p of entry.methods[s.key].curve) if (p[1] !== null) gMax = Math.max(gMax, Math.min(p[1], 50));
  const yTop = Math.pow(10, Math.ceil(Math.log10(gMax)));
  const x = t => m.l + (Math.log10(t) - Math.log10(tMin)) / (Math.log10(tMax) - Math.log10(tMin)) * (W - m.l - m.r);
  const y = g => {
    const v = Math.min(Math.max(g, GAP_FLOOR), yTop);
    return m.t + (Math.log10(yTop) - Math.log10(v)) / (Math.log10(yTop) - Math.log10(GAP_FLOOR)) * (H - m.t - m.b);
  };
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `Median gap to the reference over charged solver time, ${entry.name}` }, container);
  // Grid and axes.
  const yTicks = [];
  for (let g = 0.01; g <= yTop + 1e-12; g *= 10) yTicks.push(g);
  yTicks.unshift(GAP_FLOOR);
  for (const g of yTicks) {
    el("line", { x1: m.l, x2: W - m.r, y1: y(g), y2: y(g), stroke: "var(--grid)", "stroke-width": 1 }, svg);
    const t = el("text", { x: m.l - 8, y: y(g) + 4, "text-anchor": "end" }, svg);
    t.textContent = g === GAP_FLOOR ? "≤0.2%" : (100 * g >= 1 ? (100 * g).toFixed(0) : (100 * g).toFixed(1)) + "%";
  }
  [0.05].forEach(g => {
    if (g < yTop) el("line", { x1: m.l, x2: W - m.r, y1: y(g), y2: y(g), stroke: "var(--ink-3)", "stroke-width": 1, "stroke-dasharray": "3 4" }, svg);
  });
  if (0.05 < yTop) {
    const t = el("text", { x: m.l + 4, y: y(0.05) - 5 }, svg); t.textContent = "5% band";
  }
  const xTicks = [0.001, 0.01, 0.1, 1, 10, 100].filter(t => t >= tMin && t <= tMax * 1.0001);
  for (const t of xTicks) {
    el("line", { x1: x(t), x2: x(t), y1: m.t, y2: H - m.b, stroke: "var(--grid)", "stroke-width": 1 }, svg);
    const lab = el("text", { x: x(t), y: H - m.b + 16, "text-anchor": "middle" }, svg);
    lab.textContent = fmtTime(t);
  }
  const xl = el("text", { x: (m.l + W - m.r) / 2, y: H - 6, "text-anchor": "middle" }, svg);
  xl.textContent = "charged solver time (log)";
  // Bands then lines.
  for (const s of methods) {
    const c = entry.methods[s.key].curve;
    let d = "";
    times.forEach((t, i) => { if (c[i][0] !== null) d += (d ? "L" : "M") + x(t).toFixed(1) + "," + y(c[i][2] ?? yTop).toFixed(1); });
    for (let i = times.length - 1; i >= 0; i--) if (c[i][0] !== null) d += "L" + x(times[i]).toFixed(1) + "," + y(c[i][0]).toFixed(1);
    el("path", { d: d + "Z", fill: s.color, opacity: 0.1, stroke: "none" }, svg);
  }
  const ends = [];
  for (const s of methods) {
    const c = entry.methods[s.key].curve;
    let d = "";
    times.forEach((t, i) => { if (c[i][1] !== null) d += (d ? "L" : "M") + x(t).toFixed(1) + "," + y(c[i][1]).toFixed(1); });
    el("path", { d, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round" }, svg);
    const last = c[c.length - 1][1];
    el("circle", { cx: x(times[times.length - 1]), cy: y(last), r: 3.5, fill: s.color, stroke: "var(--surface)", "stroke-width": 2 }, svg);
    ends.push({ key: s.key, y: y(last), gap: last });
  }
  // Direct labels at line ends, nudged apart.
  ends.sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
  for (const e of ends) {
    const t = el("text", { x: W - m.r + 8, y: e.y + 4, class: "label" }, svg);
    t.textContent = e.key;
  }
  // Crosshair + tooltip.
  const cross = el("line", { y1: m.t, y2: H - m.b, stroke: "var(--ink-3)", "stroke-width": 1, visibility: "hidden" }, svg);
  const hit = el("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "transparent", tabindex: 0 }, svg);
  const tip = h("div", { class: "tooltip", hidden: "" });
  container.appendChild(tip);
  const show = (i) => {
    const t = times[i];
    cross.setAttribute("x1", x(t)); cross.setAttribute("x2", x(t)); cross.setAttribute("visibility", "visible");
    tip.replaceChildren(h("div", { class: "t-head" }, "at " + fmtTime(t) + " · median gap"));
    const rows = methods.map(s => ({ s, g: entry.methods[s.key].curve[i][1] })).sort((a, b) => a.g - b.g);
    for (const { s, g } of rows) {
      const r = h("div", { class: "t-row" });
      const key = h("i"); key.style.background = s.color;
      r.append(key, h("b", {}, fmtGap(g)), h("span", {}, s.key));
      tip.appendChild(r);
    }
    tip.hidden = false;
    const box = svg.getBoundingClientRect(), cbox = container.getBoundingClientRect();
    const px = box.left - cbox.left + x(t) / W * box.width;
    tip.style.top = (box.top - cbox.top + 16) + "px";
    tip.style.left = (px + 170 > cbox.width ? px - 170 : px + 12) + "px";
  };
  let idx = times.length - 1;
  hit.addEventListener("pointermove", ev => {
    const box = svg.getBoundingClientRect();
    const sx = (ev.clientX - box.left) / box.width * W;
    let best = 0;
    times.forEach((t, i) => { if (Math.abs(x(t) - sx) < Math.abs(x(times[best]) - sx)) best = i; });
    idx = best; show(best);
  });
  hit.addEventListener("pointerleave", () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); });
  hit.addEventListener("focus", () => show(idx));
  hit.addEventListener("blur", () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); });
  hit.addEventListener("keydown", ev => {
    if (ev.key === "ArrowLeft") { idx = Math.max(0, idx - 1); show(idx); }
    if (ev.key === "ArrowRight") { idx = Math.min(times.length - 1, idx + 1); show(idx); }
  });
}

// Final gap of every seed, one row per method: the spread is the reliability.
function stripChart(container, entry) {
  const methods = TABLE_METHODS.filter(k => entry.methods[k] && k !== "MPPI");
  const W = 400, rowH = 30, m = { l: 112, r: 16, t: 8, b: 34 };
  const H = m.t + m.b + rowH * methods.length;
  let gMax = 0.1;
  for (const k of methods) for (const g of entry.methods[k].final_gaps) gMax = Math.max(gMax, g);
  const top = Math.pow(10, Math.ceil(Math.log10(gMax)));
  const x = g => m.l + (Math.log10(Math.max(g, GAP_FLOOR)) - Math.log10(GAP_FLOOR)) / (Math.log10(top) - Math.log10(GAP_FLOOR)) * (W - m.l - m.r);
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `Final gap of every seed, ${entry.name}` }, container);
  const ticks = [GAP_FLOOR]; for (let g = 0.01; g <= top + 1e-12; g *= 10) ticks.push(g);
  for (const g of ticks) {
    el("line", { x1: x(g), x2: x(g), y1: m.t, y2: H - m.b, stroke: "var(--grid)" }, svg);
    const t = el("text", { x: x(g), y: H - m.b + 15, "text-anchor": "middle" }, svg);
    t.textContent = g === GAP_FLOOR ? "≤0.2%" : (100 * g >= 1 ? (100 * g).toFixed(0) : (100 * g).toFixed(1)) + "%";
  }
  if (0.05 < top) el("line", { x1: x(0.05), x2: x(0.05), y1: m.t, y2: H - m.b, stroke: "var(--ink-3)", "stroke-dasharray": "3 4" }, svg);
  const xl = el("text", { x: (m.l + W - m.r) / 2, y: H - 4, "text-anchor": "middle" }, svg);
  xl.textContent = "final gap, one dot per seed (log)";
  methods.forEach((k, i) => {
    const cy = m.t + rowH * i + rowH / 2;
    const lab = el("text", { x: m.l - 10, y: cy + 4, "text-anchor": "end", class: "label" }, svg);
    lab.textContent = k;
    entry.methods[k].final_gaps.forEach((g, j) => {
      const c = el("circle", { cx: x(g), cy: cy + ((j % 3) - 1) * 4, r: 4.5, fill: COLOR[k], stroke: "var(--surface)", "stroke-width": 1.5, opacity: 0.9 }, svg);
      const title = el("title", {}, c); title.textContent = `${k}, seed ${j}: ${fmtGap(g)}`;
    });
  });
}

function reachPill(r, runs) {
  const span = h("span", { class: "pill " + (r.at_end === runs ? "good" : r.at_end > 0 ? "warn" : "bad") }, `${r.at_end}/${runs}`);
  return span;
}

function problemTable(entry) {
  const wrap = h("div", { class: "table-wrap" });
  const table = h("table");
  const head = h("tr");
  ["Method", "Final gap, median", "IQR", "Worst seed", "Final ≤ 5%", "Final ≤ 25%", "Median time to ≤ 25%", "to ≤ 10%", "to ≤ 5%"].forEach(c => head.appendChild(h("th", {}, c)));
  table.appendChild(head);
  for (const k of TABLE_METHODS) {
    const m = entry.methods[k];
    if (!m) continue;
    const tr = h("tr");
    const td = h("td", { class: "method" });
    const key = h("i"); key.style.background = COLOR[k];
    td.append(key, document.createTextNode(k + (k === "MPPI" ? " (open loop)" : "")));
    tr.appendChild(td);
    tr.appendChild(h("td", {}, fmtGap(m.final_gap_median)));
    tr.appendChild(h("td", {}, `${fmtGap(m.final_gap_q25)} to ${fmtGap(m.final_gap_q75)}`));
    tr.appendChild(h("td", {}, fmtGap(m.final_gap_worst)));
    const c5 = h("td"); c5.appendChild(reachPill(m.reach["0.05"], m.runs)); tr.appendChild(c5);
    const c25 = h("td"); c25.appendChild(reachPill(m.reach["0.25"], m.runs)); tr.appendChild(c25);
    for (const tol of ["0.25", "0.10", "0.05"]) {
      const r = m.reach[tol];
      tr.appendChild(h("td", {}, r.ever * 2 > m.runs ? fmtTime(r.median_seconds) : `never (${r.ever}/${m.runs})`));
    }
    table.appendChild(tr);
  }
  wrap.appendChild(table);
  return wrap;
}

function render() {
  const root = document.getElementById("problems");
  for (const entry of DATA.problems) {
    const sec = h("section", { class: "stack", id: entry.anchor });
    const prose = h("div", { class: "prose stack" });
    prose.appendChild(h("h2", {}, entry.name));
    const ref = h("p", { class: "meta" });
    ref.textContent = `Reference cost ${entry.reference.optimum.toFixed(3)} (${entry.reference.kind}). Budget ${entry.budget.toFixed(0)} s of charged solver time per run.`;
    prose.appendChild(ref);
    if (NOTES[entry.anchor]) { const n = h("div", { class: "stack" }); n.innerHTML = NOTES[entry.anchor]; prose.appendChild(n); }
    sec.appendChild(prose);
    const grid = h("div", { class: "problem-grid" });
    const c1 = h("div", { class: "chart-card" });
    const t1 = h("div", { class: "chart-title" });
    t1.append(h("span", {}, "Median gap to the reference, IQR shaded"), h("span", {}, `${Object.values(entry.methods)[0].runs} seeds`));
    c1.appendChild(t1);
    const legend = h("div", { class: "legend" });
    for (const s of SERIES) if (entry.methods[s.key]) { const sp = h("span"); const i = h("i"); i.style.background = s.color; sp.append(i, document.createTextNode(s.key)); legend.appendChild(sp); }
    c1.appendChild(legend);
    gapChart(c1, entry);
    const c2 = h("div", { class: "chart-card" });
    c2.appendChild(h("div", { class: "chart-title" }, "Where each seed ended"));
    stripChart(c2, entry);
    grid.append(c1, c2);
    sec.appendChild(grid);
    sec.appendChild(problemTable(entry));
    root.appendChild(sec);
  }
  const mpc = document.getElementById("mpc-table");
  const head = h("tr");
  ["Problem", "Controller", "Seeds", "Gap, median", "Worst seed", "Online compute per step", "Compared against"].forEach(c => head.appendChild(h("th", {}, c)));
  mpc.appendChild(head);
  for (const entry of DATA.problems) {
    for (const [k, m] of Object.entries(entry.mpc)) {
      const tr = h("tr");
      [entry.name, k, String(m.runs), fmtGap(m.gap_median), fmtGap(m.gap_worst), (m.ms_per_step < 1 ? m.ms_per_step.toFixed(3) : m.ms_per_step.toFixed(1)) + " ms", m.reference_note].forEach(v => tr.appendChild(h("td", {}, v)));
      mpc.appendChild(tr);
    }
  }
}
render();
</script>
